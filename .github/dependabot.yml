# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # ---------------------------------------------------------------------------
  # Maven - Spring Boot microservices
  # ---------------------------------------------------------------------------
  - package-ecosystem: maven
    directories:
      - "/api-gateway"
      - "/eureka-server"
      - "/order-service"
      - "/product-service"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    labels:
      - dependencies
      - java
    assignees:
      - hendisantika
    commit-message:
      prefix: "chore(deps)"
    # Wait before proposing freshly released versions (reduces churn & supply-chain risk)
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
      exclude:
        - "org.springframework.boot*"
        - "org.springframework.cloud*"
    rebase-strategy: auto
    groups:
      # Security fixes land in a single, fast PR regardless of version bump type
      maven-security:
        applies-to: security-updates
        patterns:
          - "*"
      maven-wrapper:
        patterns:
          - "org.apache.maven:apache-maven"
          - "org.apache.maven.wrapper*"
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      spring-cloud:
        patterns:
          - "org.springframework.cloud*"
      test:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
          - "org.testcontainers*"
      lombok:
        patterns:
          - "org.projectlombok*"
      maven-minor-patch:
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # npm - React frontend
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/react-frontend"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    # Bump the range in package.json too, not only package-lock.json
    versioning-strategy: increase
    target-branch: main
    labels:
      - dependencies
      - javascript
    assignees:
      - hendisantika
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
    rebase-strategy: auto
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
      testing-library:
        patterns:
          - "@testing-library/*"
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    target-branch: main
    labels:
      - dependencies
      - github_actions
    assignees:
      - hendisantika
    commit-message:
      prefix: "ci(deps)"
    cooldown:
      default-days: 3
    rebase-strategy: auto
    groups:
      github-actions:
        patterns:
          - "*"
